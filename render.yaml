# One-click backend for the live boards: https://render.com/deploy?repo=https://github.com/TopLuau/scrawl
services:
  - type: web
    name: scrawl
    runtime: docker
    plan: free            # free instances sleep when idle; boards are temporary by default
    healthCheckPath: /healthz
    envVars:
      - key: SCRAWL_TRUST_PROXY
        value: "1"
    # Only if you set SCRAWL_KEEP=1 and want boards to survive restarts: paid plan + this disk:
    # disk:
    #   name: scrawl-data
    #   mountPath: /data
    #   sizeGB: 1
