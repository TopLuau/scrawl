[package]
name = "scrawl"
version = "0.1.0"
edition = "2021"
description = "Scrawl: a real-time collaborative whiteboard. One Rust binary, no accounts."
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tower = "0.4"
rand = "0.8"

[profile.release]
lto = "thin"
strip = true
