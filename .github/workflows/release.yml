name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    name: windows-x86_64 }
          - { os: macos-latest,     target: aarch64-apple-darwin,      name: macos-aarch64 }
          - { os: macos-latest,     target: x86_64-apple-darwin,       name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          v="${GITHUB_REF_NAME:-dev}"
          d="scrawl-$v-${{ matrix.name }}"
          mkdir -p "$d"
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/scrawl$ext" "$d/"
          cp README.md LICENSE "$d/"
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "out/$d.zip" "$d" >/dev/null; else tar czf "out/$d.tar.gz" "$d"; fi
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: out/* }

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: cd out && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
